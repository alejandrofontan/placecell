[workspace]
authors = ["alejandrofontan <fontanvillacampa@gmail.com>"]
channels = ["https://prefix.dev/conda-forge"]
name = "placecell"
version = "0.1.0"
platforms = [
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12.0" },
    "osx-arm64",   # the core, viz and the ONNX Runtime MegaLoc backend (AllFeature-VSLAM's macOS port)
]
preview = ["pixi-build"]

# One package build per Python version
[workspace.build-variants]
python = ["3.11.*", "3.12.*", "3.13.*"]

########################################################################################################################
# Package: the `placecell` Python module (nanobind bindings of the C++ core), published to
# https://prefix.dev/vslamlab/vslamlab by CI on vX.Y.Z tags (.github/workflows/conda-package.yml).
#   pixi publish --clean --target-dir output
# Built through pyproject.toml (scikit-build-core): PLACECELL_BUILD_PYTHON=ON, no examples, no MegaLoc/viz.
[package]
name = "placecell"
version = "0.1.0"
description = "Keyframe lifecycle management for VSLAM and 3D reconstruction"
authors = ["Alejandro Fontan"]
license = "Apache-2.0"
homepage = "https://github.com/alejandrofontan/placecell"
repository = "https://github.com/alejandrofontan/placecell"

[package.build]
backend = { name = "pixi-build-python", version = "0.*" }

[package.build.config]
noarch = false        # compiled extension (_placecell)
compilers = ["cxx"]
installer = "pip"

[package.build-dependencies]
cmake = ">=3.18"
ninja = "*"

[package.host-dependencies]
python = "*"
pip = "*"
scikit-build-core = ">=0.10"
nanobind = ">=2.0"
eigen = "3.4.*"        # CMakeLists asks for Eigen3 3.3 (same major); conda-forge now defaults to Eigen 5

[package.run-dependencies]
python = "*"
numpy = "*"           # nanobind's Eigen <-> NumPy conversion (similarity_from_distance, set_kernel)
########################################################################################################################

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLACECELL_BUILD_PYTHON=ON"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
example = { cmd = "./build/examples/placecell_example", depends-on = ["build"] }
# GPU-free end-to-end exercise of the core + log/profile/record managers (exit 1 on a mismatch);
# dumps kernel .npy + CSVs into placecell_demo_out/ (plot them with tools/plot_placecell.py)
demo = { cmd = "./build/examples/synthetic_demo placecell_demo_out", depends-on = ["build"] }
# Kernel-only store from a precomputed pairwise matrix, e.g. VPR-LAB's <sequence>/vpr-lab/D.npy
# (faiss squared L2 -> --kind squared-euclidean, the default): pixi run kernel-demo <matrix.npy> [--tau T] [--out dir]
# Also writes <out>/rgb.csv with the frames that survive the offline cull (rows of <sequence>/rgb.csv, or --rgb-csv)
kernel-demo = { cmd = "./build/examples/kernel_demo", depends-on = ["build"] }
# Pairwise shared-information kernel of a COLMAP reconstruction (numpy only): pixi run colmap-kernel <model_dir>
# --rgb-csv <sequence>/rgb.csv [--out dir] -> kernel.npy + ids.csv, then kernel-demo <out>/kernel.npy --kind similarity --ids <out>/ids.csv
colmap-kernel = "python tools/colmap_information_kernel.py"
# COLMAP text model from a database's verified matches + a synthetic sequence's ground truth (poses, depths):
# pixi run colmap-gt-model <colmap_database.db> --sequence <VSLAM-LAB-Benchmark/<DATASET>/<sequence>> [--out dir]
colmap-gt-model = "python tools/colmap_gt_model.py"
# Both kernels over the images COLMAP registered: heatmaps (min-max 0-1), difference, scatter + correlation stats
# pixi run compare-kernels <input> <input> [...] [--centred] [--labels ...] [--out dir] [--show]   (kernel folders or D.npy[::kind])
compare-kernels = "python tools/compare_kernels.py"
# Offline keyframe selection from a COLMAP model (kernel -> cull -> rgb.csv of survivors + checks), the
# counterpart of kernel-demo for the geometric kernel: pixi run colmap-demo <model_dir> --rgb-csv <sequence>/rgb.csv [--tau 0.9]
colmap-demo = { cmd = "python tools/colmap_kernel_demo.py", depends-on = ["build"] }
python-smoke = { cmd = '''python -c "import sys; sys.path.insert(0, 'build/python'); import _placecell; print(_placecell.PlaceCell())"''', depends-on = ["build"] }
plot = "python tools/plot_placecell.py placecell_demo_out"
clean = "rm -rf build"

[dependencies]
cxx-compiler = "*"
cmake = "*"
ninja = "*"
eigen = "*"
python = ">=3.9"
nanobind = "*"
pip = "*"
# tools/plot_placecell.py (offline plots of a PlaceCell::dump() directory)
numpy = "*"
matplotlib = "*"

[environments]
default = []
megaloc = { features = ["megaloc"], solve-group = "megaloc" }
export-megaloc = { features = ["export-megaloc", "megaloc"], solve-group = "megaloc" }
# ONNX Runtime backend (linux-64 with the CUDA provider, osx-arm64 with CoreML), no TensorRT / CUDA toolkit
megaloc-onnx = { features = ["megaloc-onnx"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
paper = { features = ["paper"], no-default-feature = true }

[feature.megaloc]
channels = ["https://repo.prefix.dev/spqr-tests"]
platforms = ["linux-64-cuda"]

[feature.megaloc.tasks]
# The megaloc env carries OpenCV, so the viz module (heatmap / information plots) builds here too
configure-megaloc = "cmake -S . -B build-megaloc -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLACECELL_WITH_MEGALOC=ON -DPLACECELL_MEGALOC_BACKEND=tensorrt -DPLACECELL_WITH_VIZ=ON -DPLACECELL_BUILD_PYTHON=ON"
demo-viz = { cmd = "./build-megaloc/examples/synthetic_demo placecell_demo_out --windows", depends-on = ["build-megaloc"] }
# The published model files (ONNX + sidecar yamls) into megaloc_models/, per file and never overwriting:
# a local tools/export_megaloc.py run produces the same names and must survive (`hf download --local-dir`
# replaces them, and pixi's `outputs` check alone does not skip the task)
download-models = "python tools/download_models.py"
build-megaloc = { cmd = "cmake --build build-megaloc", depends-on = ["configure-megaloc", "download-models"] }
megaloc-smoke = { cmd = "./build-megaloc/examples/megaloc_test", depends-on = ["build-megaloc"] }

[feature.megaloc.dependencies]
# CUDA Build Tools
cuda-compiler = "*"
cuda-version = "12.6.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"

# Tensor-RT Tools
tensorrt-cxx = "*"
tensorrt-cxx-builder = "*"
tensorrt-cxx-full = "*"

# 3D / geometry / eval / video
opencv = "4.12.*"
yaml-cpp = "*"

# `hf download` for download-models
huggingface_hub = "*"

# megaloc-onnx env = the MegaLoc embedder on ONNX Runtime (PLACECELL_MEGALOC_BACKEND=onnxruntime), the
# backend AllFeature-VSLAM uses on both platforms: CUDA execution provider on linux-64 (the cuda129 build
# of onnxruntime-cpp, CUDA 12.9 like AllFeature's env), CoreML + CPU on osx-arm64. No TensorRT, no CUDA
# toolkit, no Python. Build dir build-onnx/.
[feature.megaloc-onnx]
channels = ["https://prefix.dev/conda-forge"]

[feature.megaloc-onnx.tasks]
configure-onnx = "cmake -S . -B build-onnx -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLACECELL_WITH_MEGALOC=ON -DPLACECELL_MEGALOC_BACKEND=onnxruntime -DPLACECELL_WITH_VIZ=ON -DPLACECELL_BUILD_PYTHON=OFF"
# Per-file, never overwrites: a local export in megaloc_models/ (tools/export_megaloc.py) is kept as is
download-models-onnx = "python tools/download_models.py"
build-onnx = { cmd = "cmake --build build-onnx --parallel 3", depends-on = ["configure-onnx", "download-models-onnx"] }
# pixi run -e megaloc-onnx megaloc-test megaloc_models/megaloc_322x322.onnx <img>... [--provider cuda|coreml|cpu]
#   [--precision fp32|fp16] [--threads N] [--reference megaloc_models/megaloc_322x322_reference.txt] [--dump f] [--iters N]
megaloc-test = { cmd = "./build-onnx/examples/megaloc_test", depends-on = ["build-onnx"] }
megaloc-smoke-onnx = { cmd = "./build-onnx/examples/megaloc_embedder_smoke", depends-on = ["build-onnx"] }

[feature.megaloc-onnx.dependencies]
cxx-compiler = "*"
cmake = "*"
ninja = "*"
eigen = "3.4.*"   # find_package(Eigen3 3.3) rejects Eigen 5 (major version), and AllFeature's g2o needs 3.4 anyway
opencv = "4.12.*"
yaml-cpp = "*"
onnxruntime-cpp = "1.31.*"
huggingface_hub = "*"   # `hf download` for download-models-onnx

[feature.megaloc-onnx.target.linux-64.dependencies]
onnxruntime-cpp = { version = "1.31.*", build = "*cuda129*" }   # CUDA execution provider, CUDA 12.9
cuda-version = "12.9.*"
cuda-cudart = "*"   # libcudart.so.12: dlopened by the CUDA provider at runtime, not a declared dependency of the package
cudnn = "*"

[feature.export-megaloc]
platforms = ["linux-64-cuda"]

[feature.export-megaloc.tasks]
# Export the ONNX + sidecar, then publish them (requires `hf auth login`; creates the
# repo on first use). Only *.onnx / *.yaml are uploaded -- never the .cache dir or the
# machine-specific *.engine blobs.
# PYTHONNOUSERSITE: keep ~/.local/lib/pythonX.Y/site-packages out of the env (a stale user-site package there, e.g.
# an empty `triton` folder, shadows the real module and breaks torch's import)
export-models = { cmd = "python tools/export_megaloc.py", env = { PYTHONNOUSERSITE = "1" } }
upload-models = { cmd = "hf upload vslamlab/megaloc-models megaloc_models . --include='*.onnx' --include='*.yaml' --include='*_reference.txt'" }

[feature.export-megaloc.dependencies]
# Torch libraries: >=2.9 for the matured torch.export-based ONNX exporter (dynamo=True, the default
# exporter since 2.9; the TorchScript tracer is deprecated). The CPU build: the export traces and the
# self-check run on the CPU anyway (a few minutes), and the GPU build of 2.9 needs cuda-version >=12.9,
# which the TensorRT 10.3 packages of the shared `megaloc` solve group do not allow.
pytorch-cpu = ">=2.9"
torchvision = "*"

# ONNX libraries
onnx = "*"
onnxscript = "*"             # required by the dynamo exporter (op translation + graph optimiser)
onnxruntime = "*"
onnxconverter-common = "*"   # fp16-weights twin of the export (export_megaloc.py --fp16)

huggingface_hub = "*"
safetensors = "*"            # load_file(model.safetensors): a direct import of export_megaloc.py
git = "*"
numpy = "<2"

[feature.docs.dependencies]
python = "3.12.*"
mkdocs-material = "*"
mkdocs-mermaid2-plugin = "*"
mkdocs-literate-nav = "*"

[feature.docs.tasks]
docs-serve = { cmd = "mkdocs serve", env = { DISABLE_MKDOCS_2_WARNING = "true" } }
docs-build = { cmd = "mkdocs build --strict", env = { DISABLE_MKDOCS_2_WARNING = "true" } }
docs-links = { cmd = "python docs/tools/resolve_links.py" }
docs-check = { cmd = "python docs/tools/resolve_links.py --check && mkdocs build --strict", env = { DISABLE_MKDOCS_2_WARNING = "true" } }

[feature.paper.dependencies]
pixi = "*"
git = "*"

[feature.paper.tasks]
paper-clone = "test -d paper || git clone git@github.com:alejandrofontan/arxiv26-PlaceCell.git paper"
paper-build = { cmd = "pixi run build", cwd = "paper", depends-on = ["paper-clone"] }
paper-rebuttal = { cmd = "pixi run rebuttal", cwd = "paper", depends-on = ["paper-clone"] }
paper-watch = { cmd = "pixi run watch", cwd = "paper", depends-on = ["paper-clone"] }
paper-clean = { cmd = "pixi run clean", cwd = "paper", depends-on = ["paper-clone"] }
paper-pull = { cmd = "pixi run pull", cwd = "paper", depends-on = ["paper-clone"] }
paper-status = { cmd = "pixi run status", cwd = "paper", depends-on = ["paper-clone"] }