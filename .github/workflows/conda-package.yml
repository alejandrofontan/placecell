# Builds the placecell conda package (Python bindings, Python 3.11 / 3.12 / 3.13, linux-64) on every push to main,
# and publishes it to https://prefix.dev/vslamlab/vslamlab when a version tag (vX.Y.Z) is pushed.
# Publishing uses prefix.dev trusted publishing (OIDC): prefix.dev > Settings > Repository Access > GitHub,
# repository alejandrofontan/placecell, workflow conda-package.yml, read/write on vslamlab/vslamlab. No API key is stored.
#
# Release: bump `version` in pixi.toml [package] and pyproject.toml, push to main, then
# `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: conda-package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          pixi = tomllib.load(open('pixi.toml', 'rb'))['package']['version']
          pyproject = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if not tag == pixi == pyproject:
              sys.exit(f'tag v{tag} does not match pixi.toml [package] version {pixi} / pyproject.toml version {pyproject}')
          print(f'version {tag} OK')
          EOF

      # --clean: pixi reuses its build directory otherwise, and stale files end up in the package
      - name: Build the Python variants into a local channel
        run: pixi publish --clean --to "$PWD/channel"

      - name: Test each Python variant
        run: |
          shopt -s nullglob
          pkgs=(channel/linux-64/placecell-*.conda)
          [ ${#pkgs[@]} -eq 3 ] || { echo "expected 3 packages, found ${#pkgs[@]}"; exit 1; }
          for py in 3.11 3.12 3.13; do
            echo "== Python $py"
            pixi exec -c "$PWD/channel" -c https://prefix.dev/conda-forge -s placecell -s "python=$py" -- \
              python -c "import numpy as np, placecell as pc; D = np.zeros((3, 3), np.float32); print(pc.PlaceCell(), pc.similarity_from_distance(D, 'squared-euclidean').shape)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: placecell-packages
          path: channel/linux-64/placecell-*.conda
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing to prefix.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: placecell-packages
          path: packages

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      # --skip-existing: a re-run after a partial upload never overwrites a published file
      - name: Upload to prefix.dev
        run: pixi exec rattler-build upload prefix --skip-existing --channel vslamlab/vslamlab packages/*.conda
