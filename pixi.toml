[workspace]
authors = ["alejandrofontan <fontanvillacampa@gmail.com>"]
channels = ["https://prefix.dev/conda-forge"]
name = "placecell"
version = "0.1.0"
platforms = [
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12.0" },
]

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLACECELL_BUILD_PYTHON=ON"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
example = { cmd = "./build/examples/placecell_example", depends-on = ["build"] }
# GPU-free end-to-end exercise of the core + log/profile/record managers (exit 1 on a mismatch);
# dumps kernel .npy + CSVs into placecell_demo_out/ (plot them with tools/plot_placecell.py)
demo = { cmd = "./build/examples/synthetic_demo placecell_demo_out", depends-on = ["build"] }
# Kernel-only store from a precomputed pairwise matrix, e.g. VPR-LAB's <sequence>/vpr-lab/D.npy
# (faiss squared L2 -> --kind squared-euclidean, the default): pixi run kernel-demo <matrix.npy> [--tau T] [--out dir]
# Also writes <out>/rgb.csv with the frames that survive the offline cull (rows of <sequence>/rgb.csv, or --rgb-csv)
kernel-demo = { cmd = "./build/examples/kernel_demo", depends-on = ["build"] }
# Pairwise shared-information kernel of a COLMAP reconstruction (numpy only): pixi run colmap-kernel <model_dir>
# --rgb-csv <sequence>/rgb.csv [--out dir] -> kernel.npy + ids.csv, then kernel-demo <out>/kernel.npy --kind similarity --ids <out>/ids.csv
colmap-kernel = "python tools/colmap_information_kernel.py"
# Both kernels over the images COLMAP registered: heatmaps (min-max 0-1), difference, scatter + correlation stats
# pixi run compare-kernels <D.npy> <colmap_kernel_dir> [--centred] [--out fig.png] [--show]
compare-kernels = "python tools/compare_kernels.py"
# Offline keyframe selection from a COLMAP model (kernel -> cull -> rgb.csv of survivors + checks), the
# counterpart of kernel-demo for the geometric kernel: pixi run colmap-demo <model_dir> --rgb-csv <sequence>/rgb.csv [--tau 0.9]
colmap-demo = { cmd = "python tools/colmap_kernel_demo.py", depends-on = ["build"] }
python-smoke = { cmd = '''python -c "import sys; sys.path.insert(0, 'build/python'); import _placecell; print(_placecell.PlaceCell())"''', depends-on = ["build"] }
plot = "python tools/plot_placecell.py placecell_demo_out"
clean = "rm -rf build"

[dependencies]
cxx-compiler = "*"
cmake = "*"
ninja = "*"
eigen = "*"
python = ">=3.9"
nanobind = "*"
pip = "*"
# tools/plot_placecell.py (offline plots of a PlaceCell::dump() directory)
numpy = "*"
matplotlib = "*"

[environments]
default = []
megaloc = { features = ["megaloc"], solve-group = "megaloc" }
export-megaloc = { features = ["export-megaloc", "megaloc"], solve-group = "megaloc" }

[feature.megaloc]
channels = ["https://repo.prefix.dev/spqr-tests"]
platforms = ["linux-64-cuda"]

[feature.megaloc.tasks]
# The megaloc env carries OpenCV, so the viz module (heatmap / information plots) builds here too
configure-megaloc = "cmake -S . -B build-megaloc -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLACECELL_WITH_MEGALOC=ON -DPLACECELL_WITH_VIZ=ON -DPLACECELL_BUILD_PYTHON=ON"
demo-viz = { cmd = "./build-megaloc/examples/synthetic_demo placecell_demo_out --windows", depends-on = ["build-megaloc"] }
# Snapshot of the model repo (ONNX + sidecar yamls) into megaloc_models/; skipped once
# an ONNX is present there (also the case right after a local tools/export_megaloc.py run)
download-models = { cmd = "hf download vslamlab/megaloc-models --local-dir megaloc_models", outputs = ["megaloc_models/*.onnx"] }
build-megaloc = { cmd = "cmake --build build-megaloc", depends-on = ["configure-megaloc", "download-models"] }
megaloc-smoke = { cmd = "./build-megaloc/examples/megaloc_test", depends-on = ["build-megaloc"] }

[feature.megaloc.dependencies]
# CUDA Build Tools
cuda-compiler = "*"
cuda-version = "12.6.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"

# Tensor-RT Tools
tensorrt-cxx = "*"
tensorrt-cxx-builder = "*"
tensorrt-cxx-full = "*"

# 3D / geometry / eval / video
opencv = "4.12.*"
yaml-cpp = "*"

# `hf download` for download-models
huggingface_hub = "*"

[feature.export-megaloc]
platforms = ["linux-64-cuda"]

[feature.export-megaloc.tasks]
# Export the ONNX + sidecar, then publish them (requires `hf auth login`; creates the
# repo on first use). Only *.onnx / *.yaml are uploaded -- never the .cache dir or the
# machine-specific *.engine blobs.
export-models = "python tools/export_megaloc.py"
upload-models = { cmd = "hf upload vslamlab/megaloc-models megaloc_models . --include='*.onnx' --include='*.yaml'" }

[feature.export-megaloc.dependencies]
# Torch libraries
pytorch-gpu = "*"
torchvision = "*"

# ONNX libraries
onnx = "*"
onnxruntime = "*"

huggingface_hub = "*"
git = "*"
numpy = "<2"